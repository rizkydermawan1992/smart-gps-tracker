<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>SMART GPS TRACKER</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container-fluid mt-3">
      <h4 class="text-center mb-3">SMART GPS TRACKER</h4>

      <div class="row">
        <!-- MAP -->
        <div class="col-lg-9 mb-3">
          <div id="map"></div>
        </div>

        <!-- INFO PANEL -->
        <div class="col-lg-3">
          <div class="card card-custom p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <!-- STATUS MQTT -->
              <span id="status" class="badge badge-danger p-2">
                <i class="fas fa-signal"></i> Disconnected
              </span>

              <!-- TOGGLE GEOFENCE -->
              <div class="custom-control custom-switch">
                <input
                  type="checkbox"
                  class="custom-control-input"
                  id="geofenceSwitch"
                />
                <label class="custom-control-label" for="geofenceSwitch">
                  Geofence
                </label>
              </div>
            </div>

            <div class="row text-center">
              <div class="col-6 mb-2">
                <div class="stat-box">
                  <i class="fas fa-map-marker-alt text-primary"></i>
                  <div class="small text-muted">Latitude</div>
                  <div id="lat">-</div>
                </div>
              </div>

              <div class="col-6 mb-2">
                <div class="stat-box">
                  <i class="fas fa-map-marker text-success"></i>
                  <div class="small text-muted">Longitude</div>
                  <div id="lon">-</div>
                </div>
              </div>

              <div class="col-6">
                <div class="stat-box">
                  <i class="fas fa-mountain text-warning"></i>
                  <div class="small text-muted">Altitude (m)</div>
                  <div id="alt">-</div>
                </div>
              </div>

              <div class="col-6">
                <div class="stat-box">
                  <i class="fas fa-tachometer-alt text-danger"></i>
                  <div class="small text-muted">Speed (km/h)</div>
                  <div id="speed">-</div>
                </div>
              </div>

              <div class="col-12 mt-3">
                <div class="stat-box">
                  <i class="fas fa-map text-info"></i>
                  <div class="small text-muted">Location</div>
                  <div id="location" style="font-size: 17px">-</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FLOATING BUTTON -->
    <div class="position-fixed" style="top: 20px; right: 20px; z-index: 999">
      <button
        class="btn btn-dark btn-fab"
        data-toggle="modal"
        data-target="#configModal"
      >
        <i class="fas fa-cog"></i>
      </button>
    </div>

    <!-- MODAL CONFIG -->
    <div class="modal fade" id="configModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 15px">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fas fa-cog"></i> CONFIGURATION
            </h5>
            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
          </div>

          <div class="modal-body">
            <!-- MQTT SECTION -->
            <div
              class="p-3 mb-3"
              style="background: #f8f9fa; border-radius: 10px"
            >
              <h6 class="mb-3">
                <i class="fas fa-server text-primary"></i> MQTT
              </h6>

              <!-- Line 1 -->
              <div class="form-row">
                <div class="form-group col-6">
                  <label>Broker</label>
                  <input type="text" id="broker" class="form-control" />
                </div>
                <div class="form-group col-6">
                  <label>Port</label>
                  <input type="number" id="port" class="form-control" />
                </div>
              </div>
              <!-- Line 2 -->
              <div class="form-row">
                <div class="form-group col-6">
                  <label>Pub Topic</label>
                  <input type="text" id="pub_topic" class="form-control" />
                </div>
                <div class="form-group col-6">
                  <label>Sub Topic</label>
                  <input type="text" id="sub_topic" class="form-control" />
                </div>
              </div>
            </div>

            <!-- GEOFENCE SECTION -->
            <div class="p-3" style="background: #eef6ff; border-radius: 10px">
              <h6 class="mb-3">
                <i class="fas fa-expand-arrows-alt text-primary"></i> Geofence
              </h6>

              <div class="form-row">
                <div class="form-group col-6">
                  <label> Center </label>
                  <input
                    type="text"
                    id="geo_center"
                    class="form-control"
                    placeholder="Click on the map to select a point"
                    readonly
                  />
                </div>

                <div class="form-group col-6">
                  <label> Radius (meter) </label>
                  <input
                    type="number"
                    id="geo_radius"
                    class="form-control"
                    placeholder="Contoh: 500"
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" onclick="saveConfig()">
              <i class="fas fa-save"></i> Save
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
